<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveNote — Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ebf0;color:#182333;font:15px system-ui,sans-serif;padding:24px}h1{font-size:23px;margin:0 0 5px}p{margin:5px 0 18px;color:#526070}main{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}.phone{width:340px;max-width:100%;height:645px;border:5px solid #272a30;border-radius:36px;background:#0e0e0e;color:white;overflow:hidden;position:relative;padding:22px}.island{height:21px;width:91px;background:#000;border-radius:20px;margin:0 auto 30px}.app h2{font-size:34px;margin:10px 0 19px}.app label{font-size:13px;color:#b1b1b1;display:block;margin-bottom:8px}textarea{width:100%;height:225px;border:1px solid #343434;border-radius:14px;background:#222;color:white;padding:13px;font:19px system-ui;resize:none;outline:none}button{width:100%;border:0;border-radius:13px;background:#0a75f5;color:white;font:bold 16px system-ui;height:54px;margin-top:18px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{font-size:12px;color:#aaa;margin-top:12px}.lock{background:linear-gradient(145deg,#46566e,#141d2e);padding:12px}.date{text-align:center;margin-top:40px;font-size:14px}.clock{text-align:center;font-size:70px;font-weight:600;line-height:1.1;letter-spacing:-3px}.note{position:absolute;left:8px;right:8px;bottom:83px;height:156px;border-radius:21px;background:#0b0e15ed;padding:4px 6px;overflow:hidden}.note p{font-size:inherit;color:white;white-space:pre;margin:0;overflow:hidden;line-height:inherit}.bottom{position:absolute;bottom:24px;left:24px;right:24px;display:flex;justify-content:space-between;color:white}.bottom span{display:grid;place-items:center;width:40px;height:40px;background:#ffffff26;border-radius:50%}.home{position:absolute;bottom:8px;left:35%;width:30%;height:4px;background:#eee;border-radius:10px}.caption{font-size:12px;color:#526070;margin-top:8px}#measure{position:absolute;visibility:hidden;white-space:pre;left:-9999px}
</style>
<h1>LiveNote · Preview</h1><p>Mô phỏng giao diện trên Windows. Không phải SwiftUI thực tế.</p>
<main><div><section class="phone app"><div class="island"></div><h2>LiveNote</h2><label for="editor">Nội dung ghi chú</label><textarea id="editor" placeholder="Nhập ghi chú của bạn…">Tập trung vào mục tiêu.
Không trì hoãn.
Học tiếng Anh mỗi ngày.</textarea><button id="update">Cập nhật Live Note</button><div id="status"></div><div class="home"></div></section><div class="caption">Giao diện nhập ghi chú</div></div><div><section class="phone lock"><div class="island"></div><div class="date">Thứ Tư, 25 tháng 11</div><div class="clock">09:56</div><div class="note" id="note"></div><div class="bottom"><span>◉</span><span>▣</span></div><div class="home"></div></section><div class="caption">Màn hình khóa mô phỏng · <span id="font"></span></div></div></main><div id="measure"></div>
<script>
const e=document.getElementById('editor'),n=document.getElementById('note'),m=document.getElementById('measure'),b=document.getElementById('update');let current=e.value;
const segmenter=typeof Intl.Segmenter==='function'?new Intl.Segmenter('vi',{granularity:'grapheme'}):null;
const chars=s=>segmenter?Array.from(segmenter.segment(s),x=>x.segment):Array.from(s);
function render(){const text=current.replace(/\r\n?/g,'\n').split('\n').slice(0,10),width=n.clientWidth-14,height=n.clientHeight-8;let lines=[],size=10,row=12;
for(let s=40;s>=10;s--){m.style.fontSize=s+'px';const fits=t=>{m.textContent=t;return m.getBoundingClientRect().width<=width};let wrapped=[];for(const para of text){let line='';for(const word of para.split(/(\s+)/)){if(fits(line+word)){line+=word;continue}if(line){wrapped.push(line);line=''}if(fits(word)){line=word;continue}for(const c of chars(word)){if(line&&!fits(line+c)){wrapped.push(line);line=''}line+=c}}wrapped.push(line)}size=s;row=Math.ceil(s*1.2);const max=Math.max(1,Math.min(10,Math.floor(height/row)));lines=wrapped.slice(0,max);if(wrapped.length<=max)break;if(s===10){let tail=lines.pop()||'';while(tail&&!fits(tail+'…'))tail=chars(tail).slice(0,-1).join('');lines.push(tail+'…')}}
n.replaceChildren();n.style.fontSize=size+'px';n.style.lineHeight=row+'px';for(const line of lines){let p=document.createElement('p');p.textContent=line||' ';n.append(p)}document.getElementById('font').textContent=`${size} px · ${lines.length} dòng`;}
b.onclick=()=>{current=e.value;render();document.getElementById('status').textContent='Đã cập nhật (mô phỏng).';e.blur()};e.oninput=()=>{b.disabled=!e.value.trim()};window.addEventListener('resize',render);render();
</script></html>
